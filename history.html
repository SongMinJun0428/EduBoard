<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 관용구 20선</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1f2430;
    --sub: #5b6472;
    --accent: #4f6ef2;
    --accent-soft: #eef1ff;
    --border: #e6e8ef;
    --shadow: 0 2px 8px rgba(31, 36, 48, 0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont,
                 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  header p { color: var(--sub); margin-top: 6px; font-size: 15px; }

  .search {
    width: 100%; padding: 13px 16px; margin-bottom: 24px;
    border: 1px solid var(--border); border-radius: 12px;
    font-size: 15px; background: var(--card); box-shadow: var(--shadow);
    outline: none; transition: border-color .15s;
  }
  .search:focus { border-color: var(--accent); }

  .grid { display: grid; gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow);
    display: flex; gap: 16px; align-items: flex-start;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(31,36,48,.10); }
  .num {
    flex: 0 0 38px; height: 38px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent);
    font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .body { flex: 1; }
  .en { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
  .ko { color: var(--sub); font-size: 15px; margin-top: 4px; }

  footer { text-align: center; color: var(--sub); font-size: 13px; margin-top: 32px; }
  .empty { text-align:center; color: var(--sub); padding: 40px 0; display:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗣️ 영어 관용구 20선</h1>
    <p>자주 쓰이는 영어 idiom과 한국어 뜻 정리</p>
  </header>

  <input id="search" class="search" type="text" placeholder="🔍 영어 또는 한국어로 검색…">

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty">검색 결과가 없어요 🥲</div>

  <footer>총 20개 · 검색창에 단어를 입력하면 바로 필터링돼요</footer>
</div>

<script>
const idioms = [
  ["Hold your horses", "흥분을 가라앉히다, 잠깐 기다리다"],
  ["Let the cat out of the bag", "무심코 비밀을 누설하다"],
  ["Cat got your tongue?", "왜 아무 말도 못 하니?, 왜 꿀 먹은 벙어리처럼 있니?"],
  ["Bark up the wrong tree", "헛다리짚다, 엉뚱한 사람이나 대상을 의심하다"],
  ["Kill two birds with one stone", "일석이조, 한 가지 일로 두 가지 이익을 얻다"],
  ["The elephant in the room", "모두가 알고 있지만 말하기 꺼리는 큰 문제"],
  ["Straight from the horse’s mouth", "확실한 소식통이나 당사자에게 직접 들은"],
  ["Raining cats and dogs", "비가 억수같이 쏟아지다"],
  ["Hit the nail on the head", "정곡을 찌르다, 정확히 맞히다"],
  ["Pull someone’s leg", "누군가를 놀리다, 장난치다"],
  ["Get cold feet", "갑자기 겁을 먹다, 주저하다"],
  ["Butterflies in one’s stomach", "긴장해서 가슴이 두근거리거나 속이 조마조마하다"],
  ["Turn a blind eye", "못 본 체하다, 일부러 눈감아 주다"],
  ["Bite one’s tongue", "하고 싶은 말을 꾹 참다"],
  ["Break the ice", "서먹한 분위기를 깨다"],
  ["Lose one’s touch", "실력이 녹슬다, 예전만 못하다"],
  ["Cry over spilled milk", "이미 지나간 일을 후회하다"],
  ["Burn bridges", "관계를 완전히 끊어 버리다, 배수진을 치다"],
  ["Skeleton in the closet", "감추고 싶은 집안의 비밀이나 약점"],
  ["Go down in flames", "완전히 실패하다, 처참하게 무너지다"],
];

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const search = document.getElementById('search');

function render(list) {
  grid.innerHTML = list.map(([en, ko], i) => `
    <div class="card">
      <div class="num">${i + 1}</div>
      <div class="body">
        <div class="en">${en}</div>
        <div class="ko">${ko}</div>
      </div>
    </div>`).join('');
  empty.style.display = list.length ? 'none' : 'block';
}

search.addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  const filtered = idioms
    .map((item, idx) => [...item, idx])
    .filter(([en, ko]) => en.toLowerCase().includes(q) || ko.includes(q));
  // keep original numbering
  grid.innerHTML = filtered.map(([en, ko, idx]) => `
    <div class="card">
      <div class="num">${idx + 1}</div>
      <div class="body">
        <div class="en">${en}</div>
        <div class="ko">${ko}</div>
      </div>
    </div>`).join('');
  empty.style.display = filtered.length ? 'none' : 'block';
});

render(idioms);
</script>
</body>
</html>
